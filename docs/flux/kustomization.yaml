# Destination: kubernetes/clusters/local/obs-as-code.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: obs-as-code
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: OCIRepository
    name: obs-as-code-oci
  # The artifact root holds one directory per profile. Only the cluster profile
  # is rendered today.
  path: ./cluster
  prune: true
  wait: true
  # The Grafana instance and the operator both come from monitoring-local; a
  # dashboard applied before them is a resource the operator never sees.
  dependsOn:
    - name: monitoring-local
  healthChecks:
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: GrafanaFolder
      name: obs-as-code-examples
      namespace: monitoring
