# Destination: kubernetes/clusters/local/sources/oci/obs-as-code-oci.yaml
#
# Mirrors grafana-dashboards-chart-oci: a semver range rather than a moving tag,
# so a bad release is rolled back by deleting a tag rather than by racing a
# branch.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: obs-as-code-oci
  namespace: flux-system
  labels:
    app.kubernetes.io/component: dashboards
spec:
  interval: 10m
  url: oci://ghcr.io/duynhlab/obs-as-code
  ref:
    semver: ">=0.1.0"
  # The repository is private, so this is required until the GHCR package is
  # made public. See README.md — "Open item — registry authentication".
  #
  # secretRef:
  #   name: ghcr-pull
